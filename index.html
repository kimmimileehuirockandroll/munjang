<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FFFDFB" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="문장서랍" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" />
<title>문장서랍</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --paper:#FFFDFB; --card:#FFFFFF;
  --brown:#514A42; --brown-soft:#9C948A; --ink3:#C3BCB1; --line:#ECE6DD;
  --peach:#E9C7B4; --terracotta:#CE9276; --terracotta-d:#B4735A;
  --sage:#9FB6A0; --pink:#EBC4C4; --butter:#FBE9B4;
  --grid:rgba(176,162,142,.13);
  --shadow:0 6px 18px rgba(150,130,100,.07);
  --shadow-sm:0 1px 2px rgba(150,130,100,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color:var(--brown);font-size:15px;font-weight:400;letter-spacing:-.1px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-attachment:fixed;
  overscroll-behavior-y:none;
}
#app{max-width:460px;margin:0 auto;min-height:100%;position:relative;padding-bottom:84px;}
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 13px) 18px 10px;
  background:linear-gradient(180deg,rgba(255,253,251,.94),rgba(255,253,251,.55));
  backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:16px;color:var(--brown);letter-spacing:0;}
.brand .logo{width:27px;height:27px;flex:0 0 auto;}
.brand small{font-size:10px;color:var(--brown-soft);font-weight:400;margin-top:2px;}

/* inline hand-drawn icon helper */
.ico{width:1.05em;height:1.05em;vertical-align:-.18em;flex:0 0 auto;}
/* free-scribble hand-jitter on every icon */
#app svg,.tabbar svg{filter:url(#scr);}

/* ---------- views ---------- */
.view{display:none;padding:4px 16px 16px;animation:fade .3s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

/* ---------- home / widget ---------- */
.drawer{position:relative;margin-top:12px;}
.widget{
  position:relative;z-index:2;padding:20px 18px 16px;border-radius:11px;
  background:#FFFFFF;border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .28s cubic-bezier(.34,1.3,.5,1),opacity .28s ease;
}
.widget.pull{transform:translateY(16px) scale(.985);opacity:.35;}
.drawer-front{position:relative;z-index:1;height:34px;margin-top:-12px;
  border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,#F6EADF,#EFDFD0);box-shadow:var(--shadow-sm);}
.drawer-front .knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:8px;border-radius:8px;background:#DEBFA9;box-shadow:inset 0 1px 1px rgba(120,80,50,.12);}
.widget .tag{display:inline-flex;align-items:center;gap:5px;font-weight:500;
  font-size:11px;letter-spacing:.03em;color:var(--terracotta-d);}
.widget .tag svg{width:14px;height:14px;}
.quote{
  font-weight:300;font-size:16.5px;line-height:1.95;margin:11px 2px 12px;letter-spacing:-.2px;
  color:var(--brown);word-break:keep-all;min-height:60px;
}
.quote .qmark{color:var(--peach);font-size:18px;font-weight:400;}
.book{font-size:12px;font-weight:500;color:var(--brown-soft);text-align:right;
  border-top:1px dashed var(--line);padding-top:10px;margin-top:6px;}
.book::before{content:"— ";}
.wthought{font-size:11.5px;color:var(--brown);background:#FBF6EF;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;line-height:1.65;text-align:left;}
.thlabel{display:inline-block;font-size:9.5px;font-weight:500;color:var(--terracotta-d);margin-right:6px;letter-spacing:.02em;}
.wdate{font-size:10.5px;color:var(--ink3);text-align:right;margin-top:6px;}
.steam{position:absolute;top:13px;right:14px;width:22px;height:32px;opacity:.55;}
.steam path{stroke:var(--terracotta);stroke-width:2.4;stroke-linecap:round;fill:none;
  stroke-dasharray:7 9;animation:steam 3s linear infinite;}
.steam path:nth-child(2){animation-delay:1s;}
.steam path:nth-child(3){animation-delay:2s;}
@keyframes steam{0%{stroke-dashoffset:0;opacity:.12;}50%{opacity:.6;}100%{stroke-dashoffset:-36;opacity:.12;}}

.shuffle{
  display:flex;align-items:center;justify-content:center;gap:6px;margin:14px auto 2px;
  width:fit-content;padding:8px 18px;border:1px solid var(--line);border-radius:999px;cursor:pointer;
  font-weight:500;font-size:12.5px;color:var(--terracotta-d);background:var(--card);
  box-shadow:var(--shadow-sm);transition:transform .12s;
}
.shuffle svg{width:14px;height:14px;}
.shuffle:active{transform:scale(.96);}
.hometip{text-align:center;font-size:10.5px;color:var(--ink3);margin-top:16px;line-height:1.8;}
.hometip b{color:var(--terracotta-d);font-weight:500;}

/* ---------- library ---------- */
.secttitle{font-weight:500;font-size:15px;margin:14px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;}
.secttitle .count{font-size:11.5px;font-weight:400;color:var(--brown-soft);}
.qcard{
  background:rgba(255,255,255,.72);border-radius:10px;padding:13px 14px 10px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);border:1px solid var(--line);position:relative;
}
.qcard .t{font-weight:400;font-size:13.5px;line-height:1.8;color:var(--brown);word-break:keep-all;padding-right:20px;}
.qcard .th{font-size:12px;color:var(--brown);background:#FBF6EF;border-radius:8px;padding:7px 10px;margin-top:9px;line-height:1.6;}
.qcard .m{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);}
.qcard .b{font-size:11.5px;font-weight:500;color:var(--brown-soft);}
.qcard .d{font-size:10px;color:var(--ink3);}
.qcard .del{position:absolute;top:8px;right:8px;width:22px;height:22px;border:none;border-radius:50%;
  background:none;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.7;}
.qcard .del svg{width:12px;height:12px;}
.qcard .del:active{opacity:1;}
.backup{display:flex;gap:8px;margin:18px 2px 0;padding-top:14px;border-top:1px dashed var(--line);}
.mini{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--brown-soft);font-weight:500;font-size:12px;cursor:pointer;font-family:inherit;transition:transform .12s;}
.mini svg{width:15px;height:15px;color:var(--terracotta-d);}
.mini:active{transform:scale(.98);}
.backup-hint{text-align:center;font-size:10px;color:var(--ink3);margin:8px 2px 0;line-height:1.7;}

/* ---------- empty ---------- */
.empty{text-align:center;padding:44px 20px;color:var(--brown-soft);}
.empty .face{color:var(--terracotta-d);opacity:.85;line-height:0;}
.empty .face svg{width:44px;height:44px;}
.empty p{font-weight:500;font-size:14px;margin:12px 0 5px;color:var(--brown);}
.empty small{font-size:11.5px;color:var(--ink3);}

/* ---------- add screen ---------- */
.choice{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.choice button{
  display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.72);box-shadow:var(--shadow-sm);transition:transform .12s;
}
.choice button:active{transform:scale(.98);}
.choice .ic{width:40px;height:40px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:#F7EDE6;color:var(--terracotta-d);}
.choice .ic svg{width:22px;height:22px;}
.choice .tx b{font-weight:500;font-size:14px;display:block;color:var(--brown);}
.choice .tx span{font-size:11.5px;color:var(--brown-soft);}

.field{margin-top:14px;}
.field label{font-weight:500;font-size:13px;display:block;margin:0 3px 7px;color:var(--brown);}
.field label .opt,.opt{font-weight:400;font-size:11px;color:var(--brown-soft);}
textarea,input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;
  font-size:14px;font-weight:400;color:var(--brown);background:var(--card);resize:vertical;letter-spacing:-.1px;
}
textarea::placeholder,input::placeholder{color:var(--ink3);}
textarea:focus,input:focus{outline:none;border-color:var(--terracotta);}
.primary{
  width:100%;margin-top:16px;padding:13px;border:none;border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-weight:500;font-size:14.5px;color:#fff;background:var(--terracotta);box-shadow:var(--shadow-sm);transition:transform .12s;
}
.primary svg{width:15px;height:15px;}
.primary:active{transform:scale(.98);}
.primary:disabled{background:#DFD6CC;color:#fff;}
.ghost{width:100%;margin-top:9px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  font-weight:500;font-size:13px;color:var(--brown-soft);cursor:pointer;}
.backbtn{background:none;border:none;font-weight:500;font-size:13px;color:var(--brown-soft);cursor:pointer;padding:5px 3px;margin-bottom:2px;}

/* ---------- OCR ---------- */
.ocr-preview{width:100%;border-radius:10px;margin-top:12px;box-shadow:var(--shadow-sm);max-height:240px;object-fit:cover;border:1px solid var(--line);}
.ocr-status{text-align:center;padding:24px 10px;font-weight:500;font-size:13px;color:var(--terracotta-d);}
.spin{width:30px;height:30px;border:3.5px solid #F1E7DD;border-top-color:var(--terracotta);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.bar{height:6px;background:#F1E7DD;border-radius:6px;overflow:hidden;margin:12px auto 0;max-width:200px;}
.bar > i{display:block;height:100%;width:0;background:var(--terracotta);transition:width .2s;}
.ocr-hint{text-align:center;font-size:11.5px;color:var(--brown-soft);margin:13px 0 6px;}
.ocr-hint b{color:var(--terracotta-d);font-weight:500;}
.words{
  background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;
  line-height:2.05;font-size:14.5px;font-weight:400;color:var(--brown);touch-action:none;user-select:none;-webkit-user-select:none;
}
.words .ln{display:block;}
.word{display:inline;padding:1px 1px;border-radius:3px;cursor:pointer;transition:background .08s;}
.word.sel{background:var(--butter);color:var(--brown);}
.selbox{margin-top:13px;padding:13px;border-radius:12px;background:#FBF6EF;border:1px dashed var(--peach);display:none;}
.selbox.show{display:block;animation:fade .25s;}
.selbox label{font-weight:500;font-size:13px;color:var(--terracotta-d);}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:460px;margin:0 auto;
  display:flex;justify-content:space-around;align-items:center;
  padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);
  background:rgba(255,253,251,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;border:none;background:none;cursor:pointer;color:var(--brown-soft);}
.tab svg{width:22px;height:22px;stroke-width:1.7;}
.tab span{font-weight:500;font-size:10.5px;}
.tab.active{color:var(--terracotta-d);}
.tab.add .plus{width:42px;height:42px;margin-top:-20px;border-radius:50%;background:var(--terracotta);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(180,115,90,.35);}
.tab.add .plus svg{width:22px;height:22px;color:#fff;stroke-width:2.2;}
.tab.add span{color:var(--terracotta-d);}

/* toast */
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
  background:var(--brown);color:#fff;font-weight:500;font-size:13px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:80%;text-align:center;}
.toast.show{opacity:.96;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true"><defs>
  <filter id="scr" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="#B4735A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 14.5V9c0-.6.5-1 1-1h8c.6 0 1 .4 1 1v5.5"/>
        <path d="M13.5 11h5M13.5 13h3.4" stroke-width="1.4" opacity=".6"/>
        <rect x="6.5" y="14.5" width="19" height="10" rx="2.4"/>
        <path d="M13.4 19.6q2.6-.6 5.2 0" stroke-width="2"/>
        <path d="M27.3 8.2v2.7M25.9 9.5h2.8" stroke-width="1.5" opacity=".7"/>
      </svg>
      <div>문장서랍<br><small>아껴 둔 문장을 꺼내요</small></div>
    </div>
  </div>

  <!-- HOME / WIDGET -->
  <section id="v-home" class="view active">
    <div class="drawer">
      <div class="widget" id="homeCard">
        <span class="tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.6c.6 4 2 5.4 6 6-4 .6-5.4 2-6 6-.6-4-2-5.4-6-6 4-.6 5.4-2 6-6z"/>
            <path d="M19.4 4.4v2.3M18.3 5.5h2.2" stroke-width="1.3" opacity=".7"/>
          </svg>
          오늘의 문장
        </span>
        <div class="quote" id="homeQuote"></div>
        <div class="book" id="homeBook"></div>
        <div class="wthought" id="homeThought" style="display:none"></div>
        <div class="wdate" id="homeDate"></div>
      </div>
      <div class="drawer-front"><span class="knob"></span></div>
    </div>
    <button class="shuffle" onclick="shuffleHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="12.5" width="16" height="7" rx="1.6"/>
        <path d="M9.4 16q2.6-.5 5.2 0"/>
        <path d="M12 9.8V3.7M9.4 6.1 12 3.5 14.6 6.1" stroke-width="1.7"/>
      </svg>
      한 장 더 꺼내기
    </button>
    <p class="hometip">홈 화면에 추가하면 <b>작은 위젯</b>처럼 쓸 수 있어요.<br>공유 버튼 → <b>홈 화면에 추가</b> 를 눌러보세요
      <svg class="ico" style="color:var(--terracotta-d)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 12 5l7.5 6.5"/><path d="M6.5 10.5V19h11v-8.5"/><path d="M10 19v-4h4v4"/></svg>
    </p>
  </section>

  <!-- LIBRARY -->
  <section id="v-lib" class="view">
    <div class="secttitle">나의 서랍 <span class="count" id="libCount"></span></div>
    <div id="libList"></div>
    <div class="backup">
      <button class="mini" onclick="exportData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M5 18.5h14"/></svg>
        백업 내보내기
      </button>
      <button class="mini" onclick="document.getElementById('importFile').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V5"/><path d="M8 8.5l4-4 4 4"/><path d="M5 18.5h14"/></svg>
        불러오기
      </button>
    </div>
    <p class="backup-hint">문장을 파일로 저장해 두면 폰을 바꿔도 안전해요.<br>나에게 카톡·메일로 보내두거나 파일앱에 보관하세요.</p>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
  </section>

  <!-- ADD (choice) -->
  <section id="v-add" class="view">
    <div class="secttitle">문장 담기</div>
    <div class="choice">
      <button onclick="showView('photo')">
        <div class="ic a">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9q0-1.6 1.6-1.6h1.9L8.7 5.6h6.6l1.2 1.8h1.9q1.6 0 1.6 1.6v7.4q0 1.6-1.6 1.6H5.6Q4 18 4 16.4z"/>
            <path d="M12 10.4q3.1 0 3.1 3.1 0 3.1-3.1 3.1-3.1 0-3.1-3.1 0-3.1 3.1-3.1z"/>
            <path d="M6.7 9.3h.02" stroke-width="2.3"/>
          </svg>
        </div>
        <div class="tx"><b>사진에서 담기</b><span>책을 찍으면 글자를 읽어 드릴게요</span></div>
      </button>
      <button onclick="showView('type')">
        <div class="ic b">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 19.2 6 15.6 15.5 6q1.5-1.4 2.9 0 1.4 1.5 0 2.9L8.9 18.4z"/>
            <path d="M13.8 7.6 16.7 10.5"/>
            <path d="M5 19.2q1.9-.3 3.6-.8"/>
            <path d="M18.4 3.7l1.2-1M20.6 5l1-.9" stroke-width="1.3" opacity=".55"/>
          </svg>
        </div>
        <div class="tx"><b>직접 적기</b><span>마음에 든 문장을 손으로 적어요</span></div>
      </button>
    </div>
  </section>

  <!-- TYPE -->
  <section id="v-type" class="view">
    <button class="backbtn" onclick="showView('add')">‹ 뒤로</button>
    <div class="secttitle">직접 적기</div>
    <div class="field"><label>마음에 담을 문장</label>
      <textarea id="typeText" rows="4" placeholder="예) 우리는 모두 시궁창에 있지만, 그 중 몇몇은 별을 바라본다."></textarea></div>
    <div class="field"><label>책 제목 <span class="opt">(선택)</span></label>
      <input type="text" id="typeBook" placeholder="예) 도리언 그레이의 초상" /></div>
    <div class="field"><label>저자 <span class="opt">(선택)</span></label>
      <input type="text" id="typeAuthor" placeholder="예) 오스카 와일드" /></div>
    <div class="field"><label>내 생각 <span class="opt">(선택)</span></label>
      <input type="text" id="typeThought" placeholder="이 문장에서 느낀 점을 한 줄로" /></div>
    <button class="primary" onclick="saveTyped()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5S4.7 15 4.7 9.7C4.7 7.2 6.6 5.4 9 5.4c1.6 0 2.6.9 3 1.9.4-1 1.4-1.9 3-1.9 2.4 0 4.3 1.8 4.3 4.3C19.3 15 12 19.5 12 19.5z"/><path d="M19.2 15.2v1.9M18.2 16.1h1.9" stroke-width="1.2" opacity=".55"/></svg>
      서랍에 담기
    </button>
  </section>

  <!-- PHOTO / OCR -->
  <section id="v-photo" class="view">
    <button class="backbtn" onclick="showView('add')">‹ 뒤로</button>
    <div class="secttitle">사진에서 담기</div>
    <div id="ocrStart">
      <div class="choice">
        <button onclick="pickImage()">
          <div class="ic a">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.6 6.6h14.8q1 0 1 1v8.8q0 1-1 1H4.6q-1 0-1-1V7.6q0-1 1-1z"/>
              <path d="M8 10.4q1.3 0 1.3 1.3 0 1.3-1.3 1.3-1.3 0-1.3-1.3 0-1.3 1.3-1.3z"/>
              <path d="M4.5 16.6 9 12.5l3 2.4 3.3-3.6 4.2 5.1"/>
            </svg>
          </div>
          <div class="tx"><b>사진 고르기 / 찍기</b><span>책 페이지 사진을 올려주세요</span></div>
        </button>
      </div>
      <p class="ocr-hint" style="margin-top:18px">글자는 <b>기기 안에서</b> 읽어요. 사진은 어디에도 전송되지 않아요
        <svg class="ico" style="color:var(--terracotta-d)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 11h11c.5 0 1 .4 1 1v5.8c0 .6-.5 1-1 1h-11c-.6 0-1-.4-1-1V12c0-.6.4-1 1-1z"/><path d="M8.5 11V8.6a3.5 3.5 0 0 1 7 0V11"/><path d="M12 14v2"/></svg>
      </p>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none" />

    <div id="ocrBusy" style="display:none">
      <img id="ocrImg" class="ocr-preview" alt="" />
      <div class="ocr-status">
        <div class="spin"></div>
        글자를 살펴보는 중이에요…
        <div class="bar"><i id="ocrBar"></i></div>
      </div>
    </div>

    <div id="ocrResult" style="display:none">
      <img id="ocrImg2" class="ocr-preview" alt="" />
      <p class="ocr-hint">담고 싶은 곳을 <b>손으로 쓱 드래그</b> 해보세요
        <svg class="ico" style="color:var(--terracotta-d)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5c.5 3.4 1.8 4.7 5.2 5.2-3.4.5-4.7 1.8-5.2 5.2-.5-3.4-1.8-4.7-5.2-5.2C10.2 9.2 11.5 7.9 12 4.5z"/></svg>
      </p>
      <div class="words" id="wordArea"></div>
      <div class="selbox" id="selBox">
        <label>이 문장을 담을까요?</label>
        <textarea id="selText" rows="3" style="margin-top:8px"></textarea>
        <input type="text" id="ocrBook" placeholder="책 제목 (선택)" style="margin-top:10px" />
        <input type="text" id="ocrAuthor" placeholder="저자 (선택)" style="margin-top:8px" />
        <input type="text" id="ocrThought" placeholder="내 생각 (선택)" style="margin-top:8px" />
        <button class="primary" onclick="saveOcr()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5S4.7 15 4.7 9.7C4.7 7.2 6.6 5.4 9 5.4c1.6 0 2.6.9 3 1.9.4-1 1.4-1.9 3-1.9 2.4 0 4.3 1.8 4.3 4.3C19.3 15 12 19.5 12 19.5z"/><path d="M19.2 15.2v1.9M18.2 16.1h1.9" stroke-width="1.2" opacity=".55"/></svg>
          서랍에 담기
        </button>
      </div>
      <button class="ghost" onclick="pickImage()">다른 사진 고르기</button>
    </div>
  </section>
</div>

<!-- TABBAR -->
<nav class="tabbar">
  <button class="tab active" data-tab="home" onclick="showView('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.7q8-6.5 16 0"/><path d="M6 11V19q0 .6.6.6H17.4q.6 0 .6-.6v-8"/><path d="M9.7 19.3V15q0-.4.4-.4h3.8q.4 0 .4.4v4.3"/></svg>
    <span>오늘</span>
  </button>
  <button class="tab" data-tab="lib" onclick="showView('lib')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4.3" y="5.5" width="15.4" height="13" rx="1.8"/><path d="M4.3 10.5h15.4M4.3 15h15.4"/><path d="M10 7.9q2-.4 4 0M10 12.4q2-.4 4 0"/></svg>
    <span>서랍</span>
  </button>
  <button class="tab add" data-tab="add" onclick="showView('add')">
    <div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 6.3q.3 5.7 0 11.4M6.3 12q5.7-.3 11.4 0"/></svg></div>
    <span>담기</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
/* ---------------- hand-drawn icons (for JS-rendered bits) ---------------- */
const ICON={
  sprout:'<svg viewBox="0 0 24 24" fill="none" stroke="#9FB6A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px"><path d="M12 20v-7.5"/><path d="M12 13.5C11.3 11 8.6 10 6 10.4c-.2 2.6 1.9 4.2 5.2 3.8"/><path d="M12 12.6c.6-2.2 2.9-3.1 5.1-2.6.2 2.4-1.7 3.8-4.7 3.4"/></svg>',
  drawer:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="6.5" width="21" height="19" rx="2.4"/><path d="M5.5 13h21M5.5 19.5h21"/><path d="M13 9.6q3-.5 6 0M13 16.1q3-.5 6 0M13 22.6q3-.5 6 0"/></svg>'
};

/* ---------------- storage ---------------- */
const KEY='moramoram_quotes';
const SEED=[
  {text:'우리는 모두 시궁창에 있지만,\n그 중 몇몇은 별을 바라본다.',book:'윈더미어 부인의 부채',author:'오스카 와일드',thought:'힘든 순간에도 시선을 어디에 둘지는 내가 정한다.'},
  {text:'가장 어두운 밤도\n결국엔 끝나고 해는 떠오른다.',book:'레 미제라블',author:'빅터 위고',thought:''},
  {text:'삶이 있는 한 희망은 있다.',book:'',author:'키케로',thought:''},
];
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d))return d;}catch(e){}
  const seeded=SEED.map((s,i)=>({id:Date.now()-i,text:s.text,book:s.book,author:s.author,thought:s.thought,date:Date.now()-i*86400000}));
  localStorage.setItem(KEY,JSON.stringify(seeded));return seeded;
}
let quotes=load();
function save(){localStorage.setItem(KEY,JSON.stringify(quotes));}
function fmt(ts){const d=new Date(ts);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}

/* ---------------- views ---------------- */
const VIEWS={home:'v-home',lib:'v-lib',add:'v-add',type:'v-type',photo:'v-photo'};
function showView(name){
  Object.values(VIEWS).forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(VIEWS[name]).classList.add('active');
  const tabName={home:'home',lib:'lib',add:'add',type:'add',photo:'add'}[name];
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tabName));
  if(name==='home')renderHome();
  if(name==='lib')renderLib();
  if(name==='photo')resetPhoto();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* 책 제목 · 저자 표시 문자열 */
function cite(q,fb){const b=(q.book||'').trim(),a=(q.author||'').trim();return (b&&a)?b+' · '+a:(b||a||fb);}

/* ---------------- home widget ---------------- */
let homeIdx=-1;
function renderHome(){
  const th=document.getElementById('homeThought');
  if(!quotes.length){
    document.getElementById('homeQuote').innerHTML=`<span style="font-size:14px;color:var(--brown-soft)">아직 담은 문장이 없어요.<br>아래 <b>담기</b>로 첫 문장을 남겨보세요 ${ICON.sprout}</span>`;
    document.getElementById('homeBook').textContent='';document.getElementById('homeDate').textContent='';th.style.display='none';return;
  }
  if(homeIdx<0)homeIdx=Math.floor(Math.random()*quotes.length);
  const q=quotes[homeIdx];
  document.getElementById('homeQuote').innerHTML='<span class="qmark">“</span>'+esc(q.text).replace(/\n/g,'<br>')+'<span class="qmark">”</span>';
  document.getElementById('homeBook').textContent=cite(q,'어느 책에서');
  const t=(q.thought||'').trim();
  if(t){th.innerHTML='<span class="thlabel">내 생각</span>'+esc(t);th.style.display='block';}else{th.style.display='none';}
  document.getElementById('homeDate').textContent=fmt(q.date)+' 에 담음';
}
function shuffleHome(){
  if(quotes.length<2){renderHome();return;}
  let n;do{n=Math.floor(Math.random()*quotes.length);}while(n===homeIdx);
  homeIdx=n;
  const card=document.getElementById('homeCard');card.classList.add('pull');
  setTimeout(()=>{renderHome();card.classList.remove('pull');},240);
}

/* ---------------- library ---------------- */
function renderLib(){
  const list=document.getElementById('libList');
  document.getElementById('libCount').textContent=quotes.length?`${quotes.length}개의 문장`:'';
  if(!quotes.length){
    list.innerHTML=`<div class="empty"><div class="face">${ICON.drawer}</div><p>서랍이 비어 있어요</p><small>마음에 든 문장을 담아 채워보세요</small></div>`;return;
  }
  list.innerHTML=quotes.slice().sort((a,b)=>b.date-a.date).map(q=>`
    <div class="qcard">
      <button class="del" onclick="delQuote(${q.id})" aria-label="삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 7.3q4.6 4.6 8.8 9.4M16.4 7.3q-4.6 4.6-8.8 9.4"/></svg></button>
      <div class="t">${esc(q.text).replace(/\n/g,'<br>')}</div>
      ${(q.thought||'').trim()?`<div class="th"><span class="thlabel">내 생각</span>${esc(q.thought.trim())}</div>`:''}
      <div class="m"><span class="b">${esc(cite(q,'어느 책'))}</span><span class="d">${fmt(q.date)}</span></div>
    </div>`).join('');
}
function delQuote(id){
  if(!confirm('이 문장을 서랍에서 뺄까요?'))return;
  quotes=quotes.filter(q=>q.id!==id);save();
  if(homeIdx>=quotes.length)homeIdx=-1;
  renderLib();
}

/* ---------------- add: typed ---------------- */
function saveTyped(){
  const t=document.getElementById('typeText').value.trim();
  if(!t){toast('문장을 적어주세요');return;}
  quotes.push({id:Date.now(),text:t,
    book:document.getElementById('typeBook').value.trim(),
    author:document.getElementById('typeAuthor').value.trim(),
    thought:document.getElementById('typeThought').value.trim(),
    date:Date.now()});
  save();
  ['typeText','typeBook','typeAuthor','typeThought'].forEach(id=>document.getElementById(id).value='');
  toast('서랍에 담았어요');homeIdx=-1;showView('home');
}

/* ---------------- add: photo + OCR ---------------- */
function resetPhoto(){
  document.getElementById('ocrStart').style.display='block';
  document.getElementById('ocrBusy').style.display='none';
  document.getElementById('ocrResult').style.display='none';
  document.getElementById('selBox').classList.remove('show');
}
function pickImage(){document.getElementById('fileInput').value='';document.getElementById('fileInput').click();}
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  document.getElementById('ocrImg').src=url;document.getElementById('ocrImg2').src=url;
  document.getElementById('ocrStart').style.display='none';
  document.getElementById('ocrResult').style.display='none';
  document.getElementById('ocrBusy').style.display='block';
  document.getElementById('ocrBar').style.width='0%';
  runOCR(url);
});
async function runOCR(url){
  try{
    const {data}=await Tesseract.recognize(url,'kor+eng',{
      logger:m=>{if(m.status==='recognizing text')document.getElementById('ocrBar').style.width=Math.round(m.progress*100)+'%';}
    });
    buildWords(data);
  }catch(err){
    document.getElementById('ocrBusy').innerHTML='<div class="ocr-status">글자를 읽지 못했어요<br><small style="font-weight:400">더 밝고 또렷한 사진으로 다시 시도해보세요</small></div><button class="ghost" onclick="resetPhoto()">다시</button>';
  }
}
function buildWords(data){
  document.getElementById('ocrBusy').style.display='none';
  document.getElementById('ocrResult').style.display='block';
  const area=document.getElementById('wordArea');area.innerHTML='';
  const lines=(data.lines&&data.lines.length)?data.lines:[{words:data.words||[]}];
  let idx=0;
  if(!lines.some(l=>l.words&&l.words.length)){
    area.innerHTML='<div style="color:var(--brown-soft);text-align:center">읽어낸 글자가 없어요.<br>더 또렷한 사진으로 시도해보세요.</div>';return;
  }
  lines.forEach(line=>{
    const ln=document.createElement('span');ln.className='ln';
    (line.words||[]).forEach(w=>{
      const t=(w.text||'').trim();if(!t)return;
      const sp=document.createElement('span');sp.className='word';sp.dataset.i=idx++;sp.textContent=t;
      ln.appendChild(sp);ln.appendChild(document.createTextNode(' '));
    });
    area.appendChild(ln);
  });
  enableDragSelect();
}

/* drag-to-select over words */
let dragging=false,startI=-1,endI=-1;
function enableDragSelect(){
  const area=document.getElementById('wordArea');
  const words=[...area.querySelectorAll('.word')];
  const idxOf=el=>el&&el.classList&&el.classList.contains('word')?+el.dataset.i:null;
  function paint(){
    const lo=Math.min(startI,endI),hi=Math.max(startI,endI);
    words.forEach(w=>{const i=+w.dataset.i;w.classList.toggle('sel',i>=lo&&i<=hi);});
  }
  function commit(){
    if(startI<0)return;
    const lo=Math.min(startI,endI),hi=Math.max(startI,endI);
    const txt=words.filter(w=>{const i=+w.dataset.i;return i>=lo&&i<=hi;}).map(w=>w.textContent).join(' ');
    const box=document.getElementById('selBox');box.classList.add('show');
    document.getElementById('selText').value=txt;
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  area.onpointerdown=e=>{const i=idxOf(e.target);if(i===null)return;dragging=true;startI=endI=i;paint();e.preventDefault();};
  area.onpointermove=e=>{if(!dragging)return;const el=document.elementFromPoint(e.clientX,e.clientY);const i=idxOf(el);if(i!==null){endI=i;paint();}};
  const end=()=>{if(dragging){dragging=false;commit();}};
  area.onpointerup=end;area.onpointercancel=end;window.addEventListener('pointerup',end);
  // tap single word
  words.forEach(w=>w.addEventListener('click',()=>{if(startI!==endI)return;startI=endI=+w.dataset.i;paint();commit();}));
}
function saveOcr(){
  const t=document.getElementById('selText').value.trim();
  if(!t){toast('담을 문장을 골라주세요');return;}
  quotes.push({id:Date.now(),text:t,
    book:document.getElementById('ocrBook').value.trim(),
    author:document.getElementById('ocrAuthor').value.trim(),
    thought:document.getElementById('ocrThought').value.trim(),
    date:Date.now()});
  save();toast('서랍에 담았어요');homeIdx=-1;
  ['ocrBook','ocrAuthor','ocrThought'].forEach(id=>document.getElementById(id).value='');showView('home');
}

/* ---------------- utils ---------------- */
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800);}

/* ---------------- backup: export / import (server 없이 파일로) ---------------- */
function exportData(){
  const payload={app:'moramoram',version:1,exportedAt:Date.now(),quotes:quotes};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`문장서랍-백업-${fmt(Date.now()).replace(/\./g,'')}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('백업 파일을 저장했어요');
}
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f){return;}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      const incoming=Array.isArray(obj)?obj:(obj.quotes||[]);
      if(!Array.isArray(incoming)||!incoming.length){toast('불러올 문장이 없어요');return;}
      const seen=new Set(quotes.map(q=>q.id+'|'+q.text));
      let added=0;
      incoming.forEach(q=>{
        if(!q||!q.text)return;
        const sig=(q.id||'')+'|'+q.text;
        if(seen.has(sig))return;
        seen.add(sig);
        quotes.push({id:Date.now()+added,text:String(q.text),book:q.book?String(q.book):'',author:q.author?String(q.author):'',thought:q.thought?String(q.thought):'',date:q.date||Date.now()});
        added++;
      });
      save();homeIdx=-1;renderLib();
      toast(added?`${added}개 문장을 불러왔어요`:'이미 다 있는 문장이에요');
    }catch(err){toast('백업 파일을 읽지 못했어요');}
    e.target.value='';
  };
  r.readAsText(f);
});

/* service worker */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

renderHome();
</script>
